name: CI

# 公开仓库的质量底线：类型检查、单测与生产构建。
# 浏览器 / 桌面 E2E 是重资产校验（要装 Playwright 与 Chromium），只在手动触发时跑，
# 见 .github/workflows/e2e-manual.yml —— 不阻塞任何人提 PR。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型检查 · 单测 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（前端）
        run: npm run typecheck

      - name: 类型检查（脚本）
        run: npm run typecheck:scripts

      - name: 单测
        run: npm test

      - name: 生产构建
        run: npm run build
