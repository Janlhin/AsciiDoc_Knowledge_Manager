[package]
name = "adkm"
version = "0.0.1"
description = "ADKM — a local-first AsciiDoc/Markdown knowledge base, built on Geode"
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# R218: reveal-in-system / open-in-default-app. Hard-boundary #5 (new runtime
# dependency) unlocked by the user 2026-06-25 for THIS plugin only — scope is
# vault files (reveal/open), never open_url/arbitrary URLs.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ureq = "2"
base64 = "0.22"
# ADKM AI: OS credential store for API keys (Windows Credential Manager /
# macOS Keychain). Hard-boundary #5 (new runtime dependency) explicitly
# unlocked by the user 2026-11-14 for LLM key storage only — never for
# arbitrary network or filesystem access.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# ADKM T-039: persistent search index (FTS5). Hard-boundary #5 (new runtime
# dependency) explicitly unlocked by the user 2026-11-15 for the derived search
# index only — the vault stays plain files, the database lives in app data and
# is always rebuildable from the vault.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
